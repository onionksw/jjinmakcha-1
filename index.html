  <body>
    <div id="root"></div>
    <script>
      // 임시 진단용 — iOS 테스트플라이트에서 흰 화면만 뜨는 원인을 Mac 없이 확인하기 위함.
      // 원인 파악 후 반드시 제거할 것.
      window.addEventListener('error', function (e) {
        alert('[DIAG] window.onerror: ' + e.message + '\n' + (e.filename || '') + ':' + (e.lineno || '') + '\n' + (e.error && e.error.stack ? e.error.stack.slice(0, 300) : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason;
        alert('[DIAG] unhandledrejection: ' + (reason && reason.message ? reason.message : String(reason)) + '\n' + (reason && reason.stack ? reason.stack.slice(0, 300) : ''));
      });
      setTimeout(function () {
        var root = document.getElementById('root');
        var mounted = root && root.children.length > 0;
        if (!mounted) {
          alert('[DIAG] 8초 지나도 root가 비어있음\n'
            + 'readyState=' + document.readyState + '\n'
            + 'tailwind=' + (typeof window.tailwind) + '\n'
            + 'Kakao=' + (typeof window.Kakao));
        }
      }, 8000);
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
